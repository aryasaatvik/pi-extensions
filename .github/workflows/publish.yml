name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the publish lock without publishing.
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Version and publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version and publish packages
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: bun run release:check && bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check version branch
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/tegami/version-packages > /dev/null; then
            gh workflow run ci.yml --ref tegami/version-packages
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate publish lock (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: bun run release:check && bun run tegami publish --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
